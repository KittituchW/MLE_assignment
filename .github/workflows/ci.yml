name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install --use-feature=truststore -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/reco
      - run: pytest --cov=reco --cov-report=term-missing
      - name: Reject non-deterministic pipeline clocks
        run: '! grep -R "datetime\.now" src/reco --exclude=logging.py'
      - run: docker build -f docker/Dockerfile.serve .
      - run: docker build -f docker/Dockerfile.train .
