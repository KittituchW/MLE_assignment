[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-discovery-eda"
version = "0.1.0"
description = "EDA-aware behavior and content recommender"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.24,<3",
  "pandas>=2,<4",
  "pydantic>=2,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "uvicorn>=0.25,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.25,<1", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[project.scripts]
discovery-reco = "discovery_reco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["discovery_reco"]
branch = true

[tool.coverage.report]
fail_under = 75

