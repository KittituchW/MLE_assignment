[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-reco"
version = "0.1.0"
description = "A reproducible, behavior-driven content recommender take-home assignment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
serve = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "prometheus-client==0.26.0",
  "omegaconf==2.4.0",
  "loguru==0.7.3",
]
train = [
  "netflix-reco[serve]",
  "pandas==3.1.0",
  "pyarrow==25.0.1",
  "pandera==0.35.0",
  "scikit-learn==1.9.1",
  "mlflow==3.17.2",
]
dev = [
  "netflix-reco[train]",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[project.scripts]
reco = "reco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["slow: requires the full 32k-item catalogue"]

[tool.coverage.run]
source = ["reco"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = ["src/reco/__main__.py"]

[tool.mypy]
python_version = "3.12"
packages = ["reco"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
